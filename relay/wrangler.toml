# Cloudflare Worker: turns neuroqsp.com job-form submissions into GitHub issues.
# Deploy:  cd relay && npx wrangler deploy
# Secrets (never in this file):  npx wrangler secret put GITHUB_TOKEN
#                                npx wrangler secret put TURNSTILE_SECRET
name = "neuroqsp-jobs"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true

[vars]
GITHUB_REPO = "jsherfey/neuroqsp-website"
ALLOWED_ORIGINS = "https://neuroqsp.com,https://www.neuroqsp.com"
VIA_LABEL = "neuroqsp.com job form"

# Rate-limit / duplicate store. Create once with:  npx wrangler kv namespace create RATE
# then paste the printed id below.
[[kv_namespaces]]
binding = "RATE"
id = "f2f245836d954335a98ea29f85a6cf8b"
