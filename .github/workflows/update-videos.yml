name: Update video list

# Keeps videos.json in sync with the @NeuroQSP YouTube channel so the
# Videos page updates itself. Runs on a schedule, on push, and on demand.
on:
  schedule:
    - cron: "0 7 * * *"   # daily at 07:00 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches: [ main ]
    paths: [ "scripts/update-videos.mjs" ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch latest videos
        run: node scripts/update-videos.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet videos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "chore: refresh video list"
            git push
          else
            echo "No changes to videos.json"
          fi
